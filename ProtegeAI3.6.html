<style>
:root{color-scheme:dark;--bg:#101317;--surface:#1b2026;--surface2:#252c34;--surface3:#303943;--text:#edf2f6;--muted:#9caab8;--line:#37424d;--green:#43bc7d;--green-soft:#183f2d;--blue:#72aefb;--red:#eb7979;--radius:19px;--shadow:0 16px 50px #0007}
body.light{color-scheme:light;--bg:#f3f6f9;--surface:#fff;--surface2:#eaf0f4;--surface3:#dce6ed;--text:#1c2833;--muted:#526475;--line:#d5dfe8;--green:#118d58;--green-soft:#def6e9;--blue:#256cba;--red:#b72e38;--shadow:0 14px 34px #16273820}
*{box-sizing:border-box}html{min-height:100%;overscroll-behavior-y:none}body{margin:0;min-height:100svh;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.4;cursor:default}input,textarea,select{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:12px;min-height:43px;padding:10px 11px;max-width:100%;outline:none}textarea{min-height:76px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 2px color-mix(in srgb,var(--green) 12%,transparent)}input[type=checkbox]{width:21px;height:21px;min-height:0;accent-color:var(--green);cursor:pointer}a{color:var(--blue)}.app{max-width:1010px;margin:auto;min-height:100svh;padding:0 12px calc(110px + env(safe-area-inset-bottom));position:relative}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:5px;min-height:68px;margin:0 -12px;padding:10px 10px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.brandmark{width:38px;height:38px;display:grid;place-items:center;border-radius:13px;background:var(--green-soft);color:var(--green);font-size:22px;flex:0 0 auto}.brand{flex:1;min-width:0;font-size:21px;font-weight:800;letter-spacing:-.5px}.brand small{display:block;font-size:10px;font-weight:650;color:var(--muted);letter-spacing:0}.icon{width:41px;height:41px;border:0;border-radius:12px;display:grid;place-items:center;background:transparent;color:var(--text);position:relative;flex:0 0 auto;font-size:21px;line-height:1}.icon:hover{background:var(--surface2)}.icon.active{color:var(--green);background:var(--green-soft)}.icon:active,.btn:active,.fab:active{transform:scale(.96)}.ico{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.status-dot{width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--red);position:absolute;bottom:5px;right:3px}.status-dot.ok{background:var(--green);box-shadow:0 0 0 1px var(--green)}.status-dot.busy{background:#efbc57;box-shadow:0 0 0 1px #efbc57;animation:blink 1s infinite}@keyframes blink{50%{opacity:.35}}.top .person-label{position:absolute;font-size:9px;bottom:0;left:0;right:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;color:var(--muted);pointer-events:none}.heading{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:18px 4px 8px}.heading h1{margin:0;font-size:23px;letter-spacing:-.4px}.heading p{margin:2px 0 0;color:var(--muted);font-size:12px}.badge{background:var(--surface2);color:var(--muted);padding:5px 9px;border-radius:999px;font-size:11px;font-weight:750}.tools{display:flex;align-items:center;gap:8px;margin:10px 0 18px}.search{width:100%;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:0 9px}.search input{background:transparent;border:0;box-shadow:none;flex:1;min-width:0}.search .ico{color:var(--muted);width:19px}.segment{border:1px solid var(--line);padding:9px 12px;border-radius:13px;background:var(--surface);color:var(--muted)}.section{margin:18px 0 24px}.section-title{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:0 4px;font-size:14px;font-weight:800}.section-title:before{content:'';height:20px;width:4px;background:var(--green);border-radius:5px}.section-title small{color:var(--muted);font-weight:500;font-size:12px}.entries.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}.entries.list{display:flex;flex-direction:column;gap:8px}.entry{background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:17px 15px;min-width:0;position:relative;touch-action:pan-y;user-se /* 2.8 — flutuantes reais, fora do cabeçalho com backdrop-filter */
#app>#peopleButton.people-floating{position:fixed;left:max(20px,calc((100vw - 1010px)/2 + 24px));bottom:calc(22px + env(safe-area-inset-bottom));right:auto;top:auto;margin:0;width:60px;min-width:60px;max-width:none;height:60px;min-height:60px;flex:none;padding:0;display:grid;place-items:center;background:var(--bg);color:var(--blue);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 25px #0007;z-index:22;cursor:pointer}

#app>#peopleButton.people-floating:focus-visible{outline:3px solid var(--blue)}
/* Em Inferior transparente, ambas as áreas continuam tocáveis (60×60), mas sem placa. */

#app.floating-buttons-transparent>#addButton.fab{background:transparent;border:0;box-shadow:none;border-radius:20px}

/* v2.9: consistent 60px floating actions with centered glyphs */
#app>#peopleButton.people-floating{display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:center!important;gap:0!important;line-height:1!important;padding:0!important;background:#2483e4;color:#fff;border:1px solid #2483e4;box-shadow:0 8px 25px #0007}

}

  if(ext.vaultId!==envelope.vaultId){folderConflict=true;storageState(false);return false}

function trackVaultChanges(previous,current){

  const old=previousProfiles.get(now.id),oldItems=new Map((old?.items||[]).map(c=>[c.id,c]));

   current.syncJournal.push({id:uid(),deviceId:deviceIdentityId||'local',profileId:now.id,cardId:item.id,action:past?'edit':'add',at});
   delete current.tombstones[now.id+':'+item.id];

   current.tombstones[now.id+':'+cardId]=at;

}

async function silentReconnectAfterUnlock(){

  if(!await permission(folder,false)){storageState(false);return false}
  const ext=await readFolderEnvelope(folder);
  if(!ext){storageState(false);return false}
  if(ext.vaultId!==envelope?.vaultId){folderConflict=true;storageState(false);return false}
  if(ext.payload===envelope.payload){folderConflict=false;await dbPut('folderBaseline:'+ext.vaultId,ext);storageState(true);return true}
  const baseline=await dbGet('folderBaseline:'+ext.vaultId);
  if(!validEnvelope(baseline)){
   folderConflict=true;storageState(false);
   toast('Pasta e dispositivo diferentes. Use Reconectar para escolher sem perder dados.',true);
   return false;
  }
  if(baseline.payload===ext.payload){
   // Apenas o dispositivo mudou; gravar somente se o arquivo ainda corresponder à base.
   folderConflict=false;await persistChain;
   return await writeFolder(envelope);
  }
  if(baseline.payload===envelope.payload){
   // Apenas a pasta mudou; atualizar cache e tela sem perder alterações locais.
   const remote=await decodeVault(ext,key);await persistChain;

   await dbPut('preimport',envelope);await dbPut('vault',ext);
   envelope=ext;data=remote;persistedShadow=structuredClone(data);
   await dbPut('folderBaseline:'+ext.vaultId,ext);folderConflict=false;
   await saveLocalClock();storageState(true);renderHome();return true;
  }
  // Ambos mudaram desde a última versão comum. Comparar os itens antes de gravar.
  const originalPayload=envelope.payload;
  let ancestor,external;
  try{ancestor=await decodeVault(baseline,key);external=await decodeVault(ext,key)}
  catch{folderConflict=true;storageState(false);toast('Pasta usa outra senha mestra. Reconecte para escolher a versão.',true);return false}
  const proposed=mergeVaultThreeWay(ancestor,data,external);
  if(proposed.conflicts.length){
   await dbPut('premergeSource:'+ext.vaultId,ext);
   const choice=await resolveMergeChoices(proposed.conflicts);
   if(!choice){folderConflict=true;storageState(false);return false}
   if(choice==='remote')for(const x of proposed.conflicts)replaceConflictPath(proposed.result,x.path,x.remote);
  }
  await persistChain;
  if(!data||envelope.payload!==originalPayload){folderConflict=true;return false}
  await dbPut('preimport',envelope);await dbPut('premergeSource:'+ext.vaultId,ext);

  await dbPut('folderBaseline:'+ext.vaultId,ext);

  await changed({render:true});

 if(!fbUser||!fb){cloudRemoteState='idle';return}
 const selected=fbUser.uid;cloudRemoteOwner=selected;cloudRemoteState='checking';cloudRemoteError='';if(!data)showAuth();
 try{const snapshot=await fb.dbMod.getDocFromServer(cloudDocRef());if(fbUser?.uid!==selected)return;const e=snapshot.exists()?snapshot.data()?.envelope:null;cloudRemoteState=validEnvelope(e)?'found':'none'}
 catch(e){if(fbUser?.uid!==selected)return;cloudRemoteState='error';cloudRemoteError=firebaseMessage(e);console.warn('Consulta do backup na abertura:',e?.code||e?.name)}
 if(!data&&fbUser?.uid===selected)showAuth();
}

  outer.querySelector('#remoteEraseCancel').onclick=()=>{if(!busy)done(false)};
  outer.querySelector('form').onsubmit=async ev=>{
   ev.preventDefault();if(busy)return;
   busy=true;const button=outer.querySelector('#remoteEraseVerify');button.disabled=true;
   try{
    const typed=outer.querySelector('#remoteErasePass').value;
    const remoteKey=await derive(typed,remote.salt,remote.iterations);
    await decodeVault(remote,remoteKey);
    outer.querySelector('#remoteErasePass').value='';done(true);
   }catch(e){outer.querySelector('#remoteEraseError').textContent='Senha incorreta ou backup remoto inválido.';busy=false;if(button.isConnected)button.disabled=false}
  };
 });
}
async function cloudEraseVault(){
 if(!fb||!fbUser){toast('Entre na conta antes de apagar dados da nuvem.',true);return}
 if(!data||!key||!envelope){toast('Desbloqueie seu cofre antes desta operação.',true);return}
 if(!navigator.onLine){toast('A exclusão exige conexão com o Firebase.',true);return}
 if(cloudBusy)return;
 const account=fbUser.uid,localId=envelope.vaultId;
 cloudBusy=true;refreshCloudUi();
 try{
  await persistChain;await cloudSaveChain.catch(()=>{});
  const ref=cloudDocRef(),snap=await fb.dbMod.getDocFromServer(ref),remote=snap.exists()?snap.data()?.envelope:null;
  if(!validEnvelope(remote)){toast('Não existe um cofre criptografado ativo nesta conta.',true);return}
  cloudBusy=false;refreshCloudUi();
  const ok=await verifyRemoteErasePassword(remote);
  if(!ok||fbUser?.uid!==account||!data)return;
  const final=await confirmDialog({title:'Apagar o cofre da nuvem?',message:'A senha do backup foi validada. O conteúdo criptografado da conta será apagado; cartões locais serão mantidos. Outros dispositivos não poderão recriá-lo automaticamente. Confirma a exclusão?',buttons:[['Cancelar',false],['Apagar conteúdo remoto',true]]});
  if(!final)return;
  cloudBusy=true;refreshCloudUi();
  let outcome='cancelled';
  await fb.dbMod.runTransaction(fb.store,async tx=>{
   const fresh=await tx.get(ref),current=fresh.exists()?fresh.data()?.envelope:null;
   if(!validEnvelope(current)||current.vaultId!==remote.vaultId||current.payload!==remote.payload||current.revision!==remote.revision){outcome='changed';return}
   tx.set(ref,{app:'ProtegeAI',schema:1,deleted:true,deletedAt:Date.now(),updatedAt:Date.now(),vaultId:remote.vaultId});
   outcome='deleted';
  });
  if(outcome!=='deleted'){toast('O backup remoto mudou antes da exclusão. Nada foi apagado.',true);return}
  await dbPut('preCloudErase:'+account+':'+remote.vaultId,remote);
  await dbPut(stampKey(account,localId),Date.now());
  cloudSuppressedVaults.add(localId);
  cloudMode='local';await dbPut('cloudMode:'+account,'local');
  cloudPending=false;cloudSyncState='idle';cloudSyncInfo='';cloudLastSyncedAt=0;cloudSyncedRevision=-1;
  await dbPut(cloudPendingKey(account),false);
  await dbDelete(cloudBaseKey(account,localId));await dbDelete('cloudLastKnown:'+account+':'+localId);
  storageState(connected);toast('Backup da nuvem apagado. Cofre local preservado.');
  if(modal?.title==='Configurações')settingsGoTo('cloud');
 }catch(e){toast('Exclusão não concluída: '+firebaseMessage(e),true);console.warn('Exclusão remota:',e?.code||e?.message)}
 finally{cloudBusy=false;refreshCloudUi();refreshStorageClocks()}
}

com a criptografia do cofre.</small></div><button class="btn outline" id="biometricControl">Verificar suporte</button></div><p class="hint" id="bioCapabilityStatus">Verificando autenticação disponível neste navegador…</p><div class="inline-form"><button id="changeMaster" class="btn outline">Alterar senha mestra</button><button id="lockNow" class="btn outline lock-now">'+icon('lock')+' Bloquear agora</button></div></section><section class="settings-panel" data-settings-panel="storage" hidden><div class="group-title">Armazenamento</div>'+peopleConnectionMarkup()+'<div id="settingsStorageSyncTimes">'+storageClockMarkup()+'</div><div class="storage-control-grid"><div class="storage-caption">Pasta local</div><button class="btn outline" id="connectFolder">'+icon('folder')+' Conectar</button><button class="btn outline" id="reconnectFolder">Reconectar</button><button class="btn green wide" id="saveNow">Salvar agora</button><div class="storage-caption">Backups criptografados</div><button class="btn outline" id="exportBackup">Exportar backup</button><button class="btn outline" id="importBackup">Importar / Mesclar</button><button class="btn outline wide" id="restorePrevious">Restaurar antes da última importação</button><button class="btn danger wide" id="disconnectFolder">Desconectar pasta</button></div><details class="storage-notices"><summary>Informações sobre armazenamento</summary>'+displayStatus()+'<p class="hint">O cache criptografado permanece no navegador. A pasta física exige autorização do Android/navegador. No modo Somente nuvem, o Firebase é o destino principal e a pasta não é necessária.</p><p class="hint">Uma data de sincronização indica confirmação da última gravação; pendências offline serão enviadas quando a conexão voltar.</p></details></section><section class="settings-panel" data-settings-panel="about" hidden><details class="usage-guide" id="usageGuide"><summary>📖 Como usar o aplicativo</summary><div class="usage-guide-body"><p>Guia rápido do ProtegeAI. Os dados do cofre são criptografados; guarde a senha mestra e exporte backups periodicamente.</p><h3>1. Começar e desbloquear</h3><p>Crie um cofre com senha mestra. Em visitas seguintes, desbloqueie com ela ou, quando configurada no dispositivo, com biometria. Sem a senha mestra ou uma forma válida de desbloqueio, o aplicativo não recupera seus dados cifrados.</p><h3>2. Criar e editar senhas</h3><p>Toque em + para cadastrar um cartão. Informe um título, tipo e os campos necessários, como usuário, senha, endereço e observações. Salve ao concluir. Use o botão de edição para alternar entre visualizar e modificar cartões; toque em um cartão para abrir seus detalhes.</p><h3>3. Copiar e proteger informações</h3><p>Abra um cartão e use os ícones de copiar, revelar e abrir links. Copiar tudo reúne os campos permitidos; campos com cadeado exigem nova confirmação. Se ativar a exigência de senha ou biometria para um campo, a proteção também vale para revelar ou copiar o valor.</p><h3>4. Pessoas e perfis</h3><p>Use o botão de pessoas para criar perfis, escolher o perfil ativo e manter os cartões de cada pessoa separados. Na seção Tipos e divisões, configure se tipos e preferências serão compartilhados entre perfis.</p><h3>5. Tipos, pastas e organização</h3><p>Você pode organizar os cartões em lista, cartões, tipos ou pastas. Para mudar a ordem, toque e segure um cartão ou pasta e arraste até a posição desejada. Solte para finalizar. Em dispositivos com teclado, a organização por setas com Alt também pode estar disponível. Para editar ícones, utilize os controles do item e do tipo.</p><h3>6. Busca e atalhos</h3><p>Use a lupa para pesquisar. Limpe a pesquisa pelo X. O botão de alternância de visualização muda a forma de organização no modo edição. Segurar botões comuns por um instante mostra a descrição da ação; segurar cartões e pastas continua iniciando o arraste.</p><h3>7. Armazenamento e sincronização</h3><p>O cache criptografado do aparelho mantém alterações locais. No modo com pasta, o arquivo só pode ser gravado quando a pasta estiver autorizada. No modo com nuvem, o Firebase precisa de login e internet; alterações offline aguardam reconexão. Com ambos conectados, a Sincronização geral atualiza os dois destinos. Data vermelha indica uma pendência identificada que pode ser sincronizada; falta de permissão ou falta de internet são mostradas separadamente.</p><h3>8. Conflitos entre dispositivos</h3><p>Se aparelhos mudarem cartões distintos offline, o ProtegeAI tenta conciliar as alterações quando voltarem à internet. Quando o mesmo campo for alterado de formas incompatíveis ou não houver uma referência confiável, o aplicativo pede uma escolha. Nunca descarte um backup antes de resolver um conflito.</p><h3>9. Importação, exportação e recuperação</h3><p>Em Armazenamento, exporte um backup criptografado e importe ou mescle arquivos existentes. A recuperação pela nuvem pode substituir o cofre atual após confirmação. Antes de importar, excluir ou trocar cofres, mantenha uma cópia de segurança independente.</p><h3>10. Configurações e voltar</h3><p>Visualização personaliza a aparência; Tipos e divisões organiza o conteúdo; Armazenamento gerencia a pasta; Login em nuvem cuida da conta; Segurança define proteção; Conteúdo reúne ajuda e informações. Voltar fecha primeiro a opção aberta e depois retorna à tela anterior. Na tela inicial, pressione Voltar duas vezes para sair.</p></div></details><div class="group-title">Informações</div><p class="hint">ProtegeAI 3.6 · Desenvolvido por Rofran Pires — 2026. Cofre offline com AES-256-GCM, PBKDF2-SHA256 e perfis separados.</p><details class="release-details"><summary>Novidades e histórico de versões</summary><div class="release-notes"><p><strong>v3.6 (21/10/2026):</strong> Navegação Android fortalecida com entrada real de histórico identificada na URL, rearmada ao abrir telas e ao restaurar o aplicativo; prevenção de saída fora da tela inicial; recuperação de navegação ao voltar de Configurações, Armazenam function normalizedName(v){return String(v||'').normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleLowerCase('pt-BR')}

function safeStamp(v){return Number.isFinite(+v)&&+v>0?+v:0}
function mergeFields(localFields,remoteFields,remoteNewer){
 const out=structuredClone(localFields||[]);
 for(const rf of remoteFields||[]){
  const idIdx=out.findIndex(f=>f.id&&rf.id&&f.id===rf.id);
  const labelMatches=out.map((f,i)=>normalizedName(f.label)===normalizedName(rf.label)?i:-1).filter(i=>i>=0);
  const i=idIdx>=0?idIdx:(labelMatches.length===1?labelMatches[0]:-1);
  if(i<0){out.push(structuredClone(rf));continue}
  const lf=out[i],newer=remoteNewer?rf:lf,older=remoteNewer?lf:rf;
  const combined={...older,...newer,id:lf.id||rf.id};
  // Se o registro mais recente contém um campo sem valor, aproveitar o valor mais antigo disponível.
  if(!String(newer.value??'').length&&String(older.value??'').length)combined.value=older.value;
  if(!String(newer.label??'').trim())combined.label=older.label;
  out[i]=combined;
 }

}
function mergeEntry(localEntry,remoteEntry){
 const remoteNewer=safeStamp(remoteEntry.updatedAt)>safeStamp(localEntry.updatedAt);
 const winner=remoteNewer?remoteEntry:localEntry,loser=remoteNewer?localEntry:remoteEntry;
 const merged={...structuredClone(loser),...structuredClone(winner),id:localEntry.id};
 merged.fields=mergeFields(localEntry.fields,remoteEntry.fields,remoteNewer);
 merged.createdAt=Math.min(safeStamp(localEntry.createdAt)||Date.now(),safeStamp(remoteEntry.createdAt)||Date.now());
 merged.updatedAt=Math.max(safeStamp(localEntry.updatedAt),safeStamp(remoteEntry.updatedAt));

  for(const c of rp.categories||[])if(!lp.categories.some(v=>normalizedName(v)===normalizedName(c)))lp.categories.push(c);
  for(const ri of rp.items||[]){
   let ix=lp.items.findIndex(i=>i.id===ri.id);
   if(ix<0){const matches=lp.items.map((i,j)=>normalizeEntryIdentity(i)===normalizeEntryIdentity(ri)?j:-1).filter(j=>j>=0);

   }
   if(ix<0){const card=structuredClone(ri);if(lp.items.some(i=>i.id===card.id))card.id=uid();lp.items.push(card);stat.newCards++;continue}

   lp.items[ix]=mergeEntry(previous,ri);stat.mergedFields+=Math.max(0,lp.items[ix].fields.length-previousFieldCount);stat.updatedCards++;

}

async function syncAllStorage(){

 const tasks=[];
 try{
  await persistChain;
  if(local&&folder){
   let granted=false;
   try{granted=await folderPermission}catch{}
   if(!granted){storageState(false);tasks.push('Pasta: permissão necessária. Use Reconectar pasta.');}
   else{
    // Pasta vazia: gravar o primeiro arquivo. Pasta com conteúdo: conciliar
    // sem substituir silenciosamente revisões externas.
    const currentFolderEnvelope=await readFolderEnvelope(folder);
    const ok=currentFolderEnvelope?await silentReconnectAfterUnlock():await resolveExternal(null,folder);
    tasks.push(ok?'Pasta local sincronizada.':'Pasta com divergência ou pendência; reconecte para resolver.');
   }

   if(!fbUser)tasks.push('Nuvem: entre na conta para sincronizar.');

   else{
    const ok=await queueCloudSave(envelope);

   }
  }

  toast(tasks.join(' '),tasks.some(t=>/necessária|divergência|pendente|offline|entre na conta/.test(t)));

  if(modal?.title==='Armazenamento')openStorageModal();

function setupButtonTips(root=document){
 if(globalButtonTipsInstalled)return;
 globalButtonTipsInstalled=true;
 let timer=null,pressed=null,tipShown=false,startX=0,startY=0,hoverTimer=null;
 const clear=()=>{clearTimeout(timer);clearTimeout(hoverTimer);timer=null;hoverTimer=null;const out=$('#helpRoot');if(out)out.innerHTML=''};
 function show(btn,x,y){if(!btn?.isConnected||btn.disabled)return;const out=$('#helpRoot');if(!out)return;
  clear();const info=buttonTipText(btn);const node=document.createElement('div');node.className='help protege-button-help';
  const strong=document.createElement('strong');strong.textContent=info.label;const description=document.createElement('small');description.textContent=info.desc;
  node.append(strong,description);out.append(node);
  const bounds=node.getBoundingClientRect(),w=window.innerWidth,h=window.innerHeight;
  node.style.left=Math.max(8,Math.min(w-bounds.width-8,x-bounds.width/2))+'px';
  node.style.top=Math.max(8,Math.min(h-bounds.height-8,y-bounds.height-14))+'px';
 }
 document.addEventListener('pointerdown',e=>{
  clear();pressed=null;tipShown=false;
  const btn=e.target.closest?.('button');
  if(!btn||btn.disabled||btn.matches('[data-long-press],[data-hold-action]')||e.button!==0)return;
  pressed=btn;startX=e.clientX;startY=e.clientY;
  timer=setTimeout(()=>{if(pressed===btn){tipShown=true;show(btn,startX,startY)}},650);
 },true);
 document.addEventListener('pointermove',e=>{if(pressed&&Math.hypot(e.clientX-startX,e.clientY-startY)>10){clear();pressed=null;tipShown=false}},true);
 const release=()=>{clearTimeout(timer);timer=null;pressed=null;if(tipShown)setTimeout(()=>{tipShown=false;clear()},330);else clear()};
 document.addEventListener('pointerup',release,true);
 document.addEventListener('pointercancel',release,true);
 // Um toque longo destinado à dica não deve também executar o clique.
 document.addEventListener('click',e=>{if(!tipShown)return;const b=e.target.closest?.('button');if(!b)return;tipShown=false;e.preventDefault();e.stopImmediatePropagation();clear()},true);
 document.addEventListener('contextmenu',e=>{const b=e.target.closest?.('button');if(b&&!b.matches('[data-long-press],[data-hold-action]'))e.preventDefault()},true);

let lastBackAttempt=0,backExitTimerMs=2200;
// ProtegeAI 3.6: o Android pode ignorar um pushState sem mudança de URL
// após restaurar um PWA. O fragmento cria uma entrada real de navegação
// em cada ativação do protetor, sem depender de listeners empilhados.
let backGuardSerial=0,backGuardBootstrapped=false,backHashFallback=false,backHashSelfEvents=0,lastPopstateAt=0;
const backEntryBaseUrl=location.href.split('#')[0];
function armBackHistory(){
 // Todo carregamento do HTML cria uma entrada nova: um histórico restaurado
 // da versão anterior não garante que ainda existe um Voltar utilizável.
 if(backGuardBootstrapped&&history.state?.protegeBackGuard===true&&history.state?.protegeBackVersion===36&&/^#protegeai-retorno-[01]$/.test(location.hash))return true;
 if(backGuardBootstrapped&&backHashFallback&&/^#protegeai-retorno-[01]$/.test(location.hash))return true;
 backGuardSerial++;
 const suffix=location.hash==='#protegeai-retorno-1'?'0':'1',hash='#protegeai-retorno-'+suffix;
 try{
  history.pushState({protegeBackGuard:true,protegeBackVersion:36},'',backEntryBaseUrl+hash);
  backHashFallback=false;
  backGuardBootstrapped=true;
  return true;
 }catch(err){
  // Arquivos locais e alguns WebViews podem recusar pushState.
  // A mudança de fragmento continua criando uma entrada de histórico.
  try{
   backHashFallback=true;
   backHashSelfEvents++;
   location.hash=hash;
   backGuardBootstrapped=true;
   return true;
  }catch(error){
   backHashSelfEvents=Math.max(0,backHashSelfEvents-1);
   console.warn('Navegação Voltar indisponível neste navegador:',error?.name||error);
   return false;
  }
 }
}

function onProtegeSystemBack(){
 if(navigateBackInApp()){
  lastBackAttempt=0;
  armBackHistory();
  return;
 }
 // Fora da tela principal não existe confirmação para sair do aplicativo.
 // Um modal que esteja carregando, uma autenticação ou uma tela bloqueada
 // jamais deve transformar o Voltar do Android em saída imediata.
 const activeOverlay=!!document.querySelector('#modalRoot .overlay,.modal-center');
 if(!data||modal||folderView||activeOverlay||deviceOverlay){
  lastBackAttempt=0;
  armBackHistory();
  return;
 }
 const now=Date.now();
 if(now-lastBackAttempt<backExitTimerMs){
  lastBackAttempt=0;
  // Somente na tela inicial: libera a navegação para sair do PWA.
  try{history.back()}catch{}
  return;
 }
 lastBackAttempt=now;
 toast('Pressione Voltar novamente para sair do aplicativo.');
 armBackHistory();
}
window.addEventListener('popstate',()=>{

});
// Plano B para navegadores que aceitam âncoras, mas bloqueiam pushState.
window.addEventListener('hashchange',()=>{
 if(!backHashFallback)return;
 if(backHashSelfEvents>0){backHashSelfEvents--;return}
 if(Date.now()-lastPopstateAt<250)return;
 onProtegeSystemBack();
});
