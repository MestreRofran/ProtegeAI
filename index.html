:root{color-scheme:dark;--bg:#101317;--surface:#1b2026;--surface2:#252c34;--surface3:#303943;--text:#edf2f6;--muted:#9caab8;--line:#37424d;--green:#43bc7d;--green-soft:#183f2d;--blue:#72aefb;--red:#eb7979;--radius:19px;--shadow:0 16px 50px #0007}
body.light{color-scheme:light;--bg:#f3f6f9;--surface:#fff;--surface2:#eaf0f4;--surface3:#dce6ed;--text:#1c2833;--muted:#526475;--line:#d5dfe8;--green:#118d58;--green-soft:#def6e9;--blue:#256cba;--red:#b72e38;--shadow:0 14px 34px #16273820}

.logo-image{width:100%;height:100%;object-fit:contain;display:block}
.top .brandmark{background:transparent!important;padding:0!important;overflow:visible}
.authLogo img{width:100%;height:100%;object-fit:contain}

/* ProtegeAI 1.5: interface compacta, grade responsiva e alvos visíveis no arraste */
.top{gap:5px}
.top .person-button,.top .icon.person-button{flex:0 0 40px;min-width:40px;max-width:40px;width:40px;height:41px;display:grid;place-items:center;padding:0;color:var(--blue)}
.top .person-button .ico{height:23px;width:23px;flex:none}
.top .brandmark{flex:0 0 34px}
#settingsButton{color:var(--muted)}#settingsButton .ico{stroke-width:2.1}
.heading{padding:8px 4px 2px;min-height:0}.heading h1{font-size:21px;line-height:1.2}
.heading p{font-size:11px;margin:0}.tools{margin:7px 0 11px}.section{margin:10px 0 17px}
.entries.cards.columns-set{grid-template-columns:repeat(var(--item-cols,1),minmax(0,1fr));gap:9px}
.folder-grid.columns-set{grid-template-columns:repeat(var(--item-cols,1),minmax(0,1fr));gap:9px}
.entries.cards.columns-set .entry{padding:12px 10px;border-radius:15px;overflow-wrap:anywhere}
.entries.cards.columns-set .entryTitle{white-space:normal;overflow:visible;overflow-wrap:anywhere;line-height:1.25;font-size:clamp(11px,3.7vw,16px)}
.entries.cards.columns-set .entryHead{gap:7px;align-items:flex-start}
.entries.cards.columns-set .entryAvatar{width:clamp(24px,8vw,41px);height:clamp(24px,8vw,41px);min-width:0;flex:0 0 auto;font-size:clamp(15px,5vw,22px);border-radius:9px}
.entries.cards.columns-set .entryAvatar .ico{width:62%;height:62%}
.entries.cards.columns-set .entryChevron .ico{height:14px;width:14px}
.entries.cards.columns-set .entryType{white-space:normal;overflow-wrap:anywhere}
.entries.cards.columns-set .homeField{min-width:0;flex-wrap:wrap}
.entries.cards.columns-set .homeField span,.entries.cards.columns-set .homeField strong{max-width:100%;overflow-wrap:anywhere;white-space:normal}
.entries.cards.columns-set .entryFields{padding-top:11px}
.entry.no-type .entryFields{padding-top:4px}
.entries.list .entry.no-type .entryFields{padding-top:0;margin-top:-1px}
.entries.list .entry.no-avatar .entryFields{padding-left:2px}
.entries.list.slim-list{gap:5px}
.entries.list.slim-list .entry{padding:7px 11px;border-radius:12px}
.entries.list.slim-list .entryAvatar{height:28px;width:28px;border-radius:8px;font-size:16px}
.entries.list.slim-list .entryAvatar .ico{width:17px;height:17px}
.entries.list.slim-list .entryTitle{font-size:14px;line-height:1.25}
.entries.list.slim-list .entryHead{gap:7px;align-items:center}
.entries.list.slim-list .entryFields{padding:3px 0 0 37px;gap:3px}
.entries.list.slim-list .entry.no-avatar .entryFields{padding-left:0}
.entries.list.slim-list .homeField{font-size:11px}
.folder-grid.folder-list.slim-list .folder-tile{padding:6px 9px;border-radius:11px;gap:9px}
.folder-grid.folder-list.slim-list .folder-picture{width:30px;height:30px;flex-basis:30px;border-radius:8px}
.folder-grid.folder-list.slim-list .folder-text strong{font-size:13px}
.folder-grid.folder-list.slim-list .folder-text small{font-size:10px}
.folder-grid.columns-set .folder-tile{padding:12px 9px;border-radius:15px;gap:8px;overflow-wrap:anywhere}
.folder-grid.columns-set .folder-picture{width:clamp(26px,8vw,48px);height:clamp(26px,8vw,48px);flex-basis:clamp(26px,8vw,48px);border-radius:10px;font-size:clamp(17px,5vw,25px)}
.folder-grid.columns-set .folder-picture .ico{width:60%;height:60%}
.folder-grid.columns-set .folder-text strong{white-space:normal;overflow-wrap:anywhere;line-height:1.25}
.folder-grid.columns-set .folder-arrow .ico{width:14px;height:14px}
.folder-picture.no-icon{display:none!important}
.custom-emoji{display:inline-block;line-height:1.15;font-size:1.15em;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.entries.cards.columns-set[data-cols="2"] .entry{padding:10px 8px}
.entries.cards.columns-set[data-cols="2"] .entryHead{gap:5px}
.entries.cards.columns-set[data-cols="2"] .entryAvatar{width:clamp(25px,7vw,35px);height:clamp(25px,7vw,35px)}
.folder-grid.columns-set[data-cols="2"] .folder-tile{padding:11px 8px;gap:6px}
@media(max-width:720px){
 .entries.cards.columns-set[data-cols="3"] .entry,.entries.cards.columns-set[data-cols="4"] .entry{padding:9px 5px;border-radius:12px}
 .entries.cards.columns-set[data-cols="3"] .entryHead,.entries.cards.columns-set[data-cols="4"] .entryHead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px}
 .entries.cards.columns-set[data-cols="3"] .entryAvatar,.entries.cards.columns-set[data-cols="4"] .entryAvatar{display:grid;width:25px;height:25px;font-size:15px}
 .entries.cards.columns-set[data-cols="4"] .entryAvatar{height:22px;width:22px;font-size:13px}
 .entries.cards.columns-set[data-cols="3"] .entryTitle,.entries.cards.columns-set[data-cols="4"] .entryTitle{font-size:clamp(10px,2.9vw,12px);line-height:1.18;white-space:normal;overflow:visible;overflow-wrap:anywhere}
 .entries.cards.columns-set[data-cols="3"] .entryChevron,.entries.cards.columns-set[data-cols="4"] .entryChevron{display:none}
 .entries.cards.columns-set[data-cols="3"] .homeField,.entries.cards.columns-set[data-cols="4"] .homeField{font-size:10px;line-height:1.2}
 .folder-grid.columns-set[data-cols="2"] .folder-tile{display:flex;flex-direction:row;text-align:left}
 .folder-grid.columns-set[data-cols="2"] .folder-picture{margin:0;width:31px;height:31px;flex:0 0 31px}
 .folder-grid.columns-set[data-cols="2"] .folder-text strong{font-size:clamp(12px,3.4vw,15px)}
 .folder-grid.columns-set[data-cols="3"] .folder-tile,.folder-grid.columns-set[data-cols="4"] .folder-tile{display:flex;flex-direction:column;text-align:center;gap:3px;align-items:center;padding:9px 4px}
 .folder-grid.columns-set[data-cols="3"] .folder-picture,.folder-grid.columns-set[data-cols="4"] .folder-picture{display:grid;margin:0 auto 3px;width:27px;height:27px;flex:0 0 27px;font-size:17px}
 .folder-grid.columns-set[data-cols="4"] .folder-picture{width:23px;height:23px;flex-basis:23px;font-size:15px}
 .folder-grid.columns-set[data-cols="3"] .folder-text strong,.folder-grid.columns-set[data-cols="4"] .folder-text strong{font-size:clamp(10px,2.7vw,12px);white-space:normal;overflow-wrap:anywhere;line-height:1.2}
 .folder-grid.columns-set[data-cols="3"] .folder-text small,.folder-grid.columns-set[data-cols="4"] .folder-text small{font-size:10px}
 .folder-grid.columns-set[data-cols="3"] .folder-arrow,.folder-grid.columns-set[data-cols="4"] .folder-arrow{display:none}
}
@media(max-width:425px){.top .person-button,.top .icon.person-button{width:33px;min-width:33px;max-width:33px;flex-basis:33px}.top .icon:not(.person-button){width:32px;flex-basis:32px}.top .brandmark{width:28px;flex-basis:28px}.top .brand{font-size:16px}.top .brand small{font-size:8px}}
.type-accordion{margin:8px 0}
.type-accordion>.section-title{cursor:pointer;display:flex;align-items:center;min-height:46px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-size:14px;margin-bottom:5px}
.type-accordion>.section-title:before{height:20px}
.type-expander{display:inline-flex;transition:transform .18s;flex:0 0 auto}
.section-title[aria-expanded="true"] .type-expander{transform:rotate(90deg)}
.type-expander .ico{width:16px;height:16px}
.emoji-choices{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.emoji-pick{border:1px solid var(--line);color:var(--text);background:var(--surface2);border-radius:9px;height:37px;min-width:37px;font-size:21px;line-height:1}
.category-icon-button{border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:28px;min-height:28px;padding:2px 4px;font-size:16px;color:var(--muted)}
/* O fantasma segue as dimensões reais e herda a mesma grade e tipografia do original. */
.drag-layer{position:fixed!important;z-index:999!important;pointer-events:none!important;display:block!important;margin:0!important;padding:0!important;max-width:none!important;background:transparent!important;transform:none!important}
.drag-layer>.entry,.drag-layer>.folder-tile,.drag-layer>.section-title,.drag-layer>.categoryTag{width:100%!important;height:100%!important;min-width:0!important;margin:0!important;box-sizing:border-box;pointer-events:none;opacity:.92;box-shadow:var(--shadow);border:1px solid var(--green)}
.drag-layer>.entry{transform:none!important}
.drag-layer>.folder-tile{display:flex}
.drop-left:before,.drop-right:after{content:'';position:absolute;top:3px;bottom:3px;width:5px;background:#46ee92;box-shadow:0 0 0 2px #13492d,0 0 13px #46ee92;border-radius:10px;z-index:8;pointer-events:none}
.drop-left:before{left:-6px}.drop-right:after{right:-6px}
.drop-before:before,.drop-after:after{background:#46ee92!important;height:5px!important;box-shadow:0 0 0 2px #13492d,0 0 13px #46ee92;z-index:8}
.folder-tile.drop-before:before,.folder-tile.drop-after:after{top:auto;bottom:auto}
.folder-tile.drop-before:before{top:-7px;bottom:auto}.folder-tile.drop-after:after{bottom:-7px;top:auto}


/* ProtegeAI 1.5: ícones discretos, editor de tipos embutido e botões alinhados. */
@media(max-width:640px){.entries.cards.columns-set[data-cols="3"] .entry-avatar-edit,.entries.cards.columns-set[data-cols="4"] .entry-avatar-edit{display:grid;width:25px;height:25px;font-size:15px;margin:0 auto}}
.editor-icon-option{margin:13px 0 4px;border:1px solid var(--line);border-radius:13px;background:var(--surface);overflow:hidden}
.editor-icon-option>summary,.category-icon-options>summary{cursor:pointer;padding:10px 12px;display:list-item;font-size:12px;color:var(--muted);font-weight:650}
.editor-icon-option summary small,.category-icon-options summary small{font-size:10px;color:var(--muted);font-weight:450;margin-left:4px}
.editor-icon-inner{padding:0 12px 12px}.editor-icon-inner>.edit-field{margin:0;border:0;padding:0;background:transparent}
.entry-avatar-edit,.folder-icon-edit{border:1px solid transparent;font:inherit;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
.entry-avatar-edit{color:var(--green)}.entry-avatar-edit:hover,.folder-icon-edit:hover{border-color:var(--green);filter:brightness(1.1)}
.category-inline-editor{display:block;width:100%;clear:both;border:1px solid color-mix(in srgb,var(--green) 55%,var(--line));border-radius:13px;padding:12px;background:var(--surface);margin:8px 0 14px}
.inline-category-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.inline-category-title .icon{width:30px;height:30px;flex-basis:30px}
.category-inline-editor label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
.category-icon-options{border:1px solid var(--line);border-radius:12px;margin-top:11px}
.category-icon-inner{padding:0 10px 10px}
.inline-category-actions{display:flex;gap:8px;margin-top:10px}.inline-category-actions .btn{flex:1}
.categoryTag .type-edit-button,.categoryTag .type-remove-button{width:25px;min-width:25px;height:25px;padding:2px;display:inline-flex;align-items:center;justify-content:center}
.categoryTag .type-edit-button .ico,.categoryTag .type-remove-button .ico{width:15px;height:15px;opacity:1}
.storage-control-grid button{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.3}
.storage-control-grid button .ico{display:block;width:18px;height:18px;flex:0 0 18px;vertical-align:middle;opacity:1}
</style>
</head>

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function base64(arr){let s='';for(let i=0;i<arr.length;i+=8192)s+=String.fromCharCode(...arr.subarray(i,i+8192));return btoa(s)}
function unbase64(v){let b=atob(v);return Uint8Array.from(b,c=>c.charCodeAt(0))}
const enc=new TextEncoder(),dec=new TextDecoder();let data=null,envelope=null,key=null,folder=null,fileHandle=null,connected=false,editMode=false,folderView=null,modal=null,lastActivity=Date.now(),persistChain=Promise.resolve(),suppressClick=false,searchText='',folderConflict=false,toastTimer=null,dialogResolve=null,sheetHistory=false,skipPop=false;
const defaultPrefs=()=>({view:'list',group:false,folders:false,columns:1,showType:false,compactList:false,collapseTypes:false,theme:'dark',lockMinutes:15,lockOnHide:false});
const newProfile=name=>({id:uid(),name,items:[],categories:['Geral','Redes sociais','E-mail','Bancos','Trabalho','Compras'],categoryIcons:{},prefs:defaultPrefs()});
const freshVault=()=>{let p=newProfile('Pessoal');return{schema:1,revision:0,vaultId:uid(),createdAt:Date.now(),updatedAt:Date.now(),activeId:p.id,profiles:[p]}};
const active=()=>data?.profiles.find(p=>p.id===data.activeId)||data?.profiles[0];
function validEnvelope(e){return e&&e.app===APP&&e.format===1&&typeof e.salt==='string'&&typeof e.iv==='string'&&typeof e.payload==='string'&&typeof e.vaultId==='string'&&Number.isSafeInteger(e.revision)&&e.revision>=0&&Number.isInteger(e.iterations)&&e.iterations>=100000&&e.iterations<=3000000}
function validVault(d,id){return d&&d.vaultId===id&&Array.isArray(d.profiles)&&d.profiles.length>0&&d.profiles.every(p=>typeof p.id==='string'&&Array.isArray(p.items)&&Array.isArray(p.categories)&&p.prefs)}
async function derive(password,salt,iterations=ITERATIONS){let material=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:unbase64(salt),iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},true,['encrypt','decrypt'])}
async function decodeVault(e,k){let raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unbase64(e.iv),additionalData:enc.encode('ProtegeAI:'+e.vaultId)},k,unbase64(e.payload));let obj=JSON.parse(dec.decode(raw));if(!validVault(obj,e.vaultId))throw Error('Cofre inválido');return obj}
async function encodeVault(snapshot,k,salt,it){let iv=crypto.getRandomValues(new Uint8Array(12));let payload=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:enc.encode('ProtegeAI:'+snapshot.vaultId)},k,enc.encode(JSON.stringify(snapshot)));return{app:APP,format:1,vaultId:snapshot.vaultId,revision:snapshot.revision,updatedAt:snapshot.updatedAt,iterations:it,salt,iv:base64(iv),payload:base64(new Uint8Array(payload))}}
function dbOpen(){return new Promise((ok,no)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('kv'))q.result.createObjectStore('kv')};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
async function dbGet(k){const db=await dbOpen();return new Promise((ok,no)=>{const t=db.transaction('kv','readonly'),r=t.objectStore('kv').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);t.oncomplete=()=>db.close()})}
async function dbPut(k,v){const db=await dbOpen();return new Promise((ok,no)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>{db.close();ok()};t.onerror=()=>{db.close();no(t.error)}})}
async function dbDelete(k){const db=await dbOpen();return new Promise((ok,no)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>{db.close();ok()};t.onerror=()=>{db.close();no(t.error)}})}
function storageState(ok,msg=''){connected=ok;const btn=$('#storageIndicator');const title=ok?'Pasta conectada — arquivo criptografado':'Pasta desconectada — cache local criptografado'+(folder?' (reconecte a pasta)':'');btn.classList.toggle('folder-connected',ok);btn.classList.toggle('folder-disconnected',!ok);btn.classList.toggle('folder-saving',msg==='saving');$('#statusSvg').innerHTML=icon(ok?'folderCheck':'folderX');btn.title=title;btn.setAttribute('aria-label',title)}
function toast(msg,error=false,wrong=false){clearTimeout(toastTimer);const root=$('#toastRoot');root.innerHTML='<div class="toast '+(wrong?'wrong':error?'error':'')+'">'+esc(msg)+'</div>';toastTimer=setTimeout(()=>root.innerHTML='',3400)}
async function permission(h,prompt=false){if(!h)return false;try{if(typeof h.queryPermission!=='function')return true;let p=await h.queryPermission({mode:'readwrite'});if(p==='prompt'&&prompt&&h.requestPermission)p=await h.requestPermission({mode:'readwrite'});return p==='granted'}catch{return false}}
async function readFolderEnvelope(h){let f;try{f=await h.getFileHandle(FILENAME,{create:false})}catch(e){if(e.name==='NotFoundError')return null;throw e}let v=JSON.parse(await (await f.getFile()).text());if(!validEnvelope(v))throw Error('O arquivo da pasta não é um cofre ProtegeAI válido');return v}
async function writeFolder(e){if(!folder||!await permission(folder,false)){storageState(false);return false}try{fileHandle=await folder.getFileHandle(FILENAME,{create:true});let w=await fileHandle.createWritable();try{await w.write(JSON.stringify(e,null,2));await w.close()}catch(ex){try{await w.abort()}catch{}throw ex}storageState(true);return true}catch(ex){storageState(false);toast('Falha ao salvar na pasta. Cache criptografado mantido.',true);console.warn('Gravação externa falhou',ex.name);return false}}
function changed({render=false}={}){if(!data||!key)return;data.revision++;data.updatedAt=Date.now();let snap=structuredClone(data);storageState(false,'saving');persistChain=persistChain.catch(()=>{}).then(async()=>{const e=await encodeVault(snap,key,envelope.salt,envelope.iterations);await dbPut('vault',e);envelope=e;if(folder&&!folderConflict)await writeFolder(e);else storageState(false)}).catch(e=>{storageState(false);toast('Falha ao salvar; não feche o aplicativo.',true);console.error('Falha na persistência',e.name)});if(render)renderHome();return persistChain}
function updateTheme(){document.body.className=active()?.prefs.theme||'dark';let tc=document.querySelector('meta[name="theme-color"]');tc.content=active()?.prefs.theme==='light'?'#f3f6f9':'#101317'}
function unlockUI(){if(!data)return;$('#authRoot').innerHTML='';updateTheme();renderHome();resetActivity()}
function lockVault(){if(!data)return;data=null;key=null;editMode=false;folderView=null;modal=null;$('#modalRoot').innerHTML='';$('#items').innerHTML='';$('#searchInput').value='';searchText='';showAuth();toast('Cofre bloqueado')}
function resetActivity(){lastActivity=Date.now()}

/* Biometria real com WebAuthn PRF: NÃO confundir validação de presença com descriptografia.
   Cada dispositivo armazena SOMENTE a chave derivada envolvida por uma chave PRF do autenticador.
   Biometria nunca transmite nem armazena rosto/impressão digital no HTML. */
let bioRecord=null;
function bioSupported(){return !!(window.isSecureContext&&window.PublicKeyCredential&&navigator.credentials?.create&&navigator.credentials?.get&&crypto?.subtle&&location.protocol!=='file:')}
function biometricActive(){return !!(bioRecord&&envelope&&bioRecord.vaultId===envelope.vaultId&&bioRecord.vaultSalt===envelope.salt&&bioRecord.credentialId&&bioRecord.cipher)}
async function clearBiometric(){bioRecord=null;try{await dbDelete('biometric')}catch(e){console.warn('Não foi possível limpar autorização biométrica',e)}}
async function updateBiometricStatus(root){
 const node=root.querySelector('#bioCapabilityStatus');if(!node)return;
 if(!bioSupported()){node.textContent='Biometria para desbloqueio: abra em HTTPS/PWA e use WebAuthn com PRF. No arquivo local esta função fica indisponível.';return}
 node.textContent='WebAuthn disponível. Conferindo autenticador do sistema…';
 try{const platform=await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();if(!node.isConnected)return;
 node.textContent=platform?'Sensor/PIN do sistema disponível. Ative e confirme a extensão PRF; somente assim o cofre poderá ser aberto com biometria.':'Nenhum autenticador local verificável detectado. Use a senha mestra. O navegador pode oferecer autenticadores externos.';
 }catch{if(node.isConnected)node.textContent='WebAuthn detectado, mas não foi possível verificar o autenticador. A extensão PRF será testada durante a ativação.'}
}
function biometricError(e){if(e?.name==='NotAllowedError')return 'Autenticação cancelada, negada ou indisponível.';if(e?.name==='NotSupportedError'||e?.name==='SecurityError')return 'O navegador ou dispositivo não oferece WebAuthn PRF neste contexto.';return e?.message||'Não foi possível concluir a operação biométrica.'}
async function getPrfSecret(id,salt){const credential=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unbase64(id)}],userVerification:'required',timeout:65000,extensions:{prf:{eval:{first:unbase64(salt)}}}}});const output=credential?.getClientExtensionResults()?.prf?.results?.first;if(!output||output.byteLength!==32)throw new Error('Este navegador/autenticador não disponibilizou a extensão PRF. Biometria simples não pode abrir um cofre criptografado.');return output}
async function enableBiometric(){if(!bioSupported()){toast('Use o PWA em HTTPS. Seu dispositivo e navegador também precisam oferecer WebAuthn com PRF; só a impressão digital não basta para descriptografar o cofre.',true);return}
 if(biometricActive())return toast('Biometria já está ativada');
 let pass=await askBiometricPassword();if(pass===null)return;
 let k;try{k=await derive(pass,envelope.salt,envelope.iterations);await decodeVault(envelope,k)}catch{toast('Senha mestra incorreta.',false,true);return}
 try{const salt=crypto.getRandomValues(new Uint8Array(32));const credential=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'ProtegeAI'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'protegeai@local',displayName:'ProtegeAI · Dispositivo pessoal'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],timeout:65000,attestation:'none',authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'preferred',userVerification:'required'},extensions:{prf:{eval:{first:salt}}}}});
 if(!credential?.rawId)throw Error('Nenhuma credencial biométrica foi criada.');
 const id=base64(new Uint8Array(credential.rawId));const salt64=base64(salt);
 let rawSecret=credential.getClientExtensionResults()?.prf?.results?.first;
 if(!rawSecret||rawSecret.byteLength!==32)rawSecret=await getPrfSecret(id,salt64);
 const wrappingKey=await crypto.subtle.importKey('raw',rawSecret,{name:'AES-GCM'},false,['encrypt']);
 const rawVaultKey=await crypto.subtle.exportKey('raw',k);const iv=crypto.getRandomValues(new Uint8Array(12));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:enc.encode('ProtegeAI-Biometrics:'+envelope.vaultId+':'+envelope.salt)},wrappingKey,rawVaultKey);
 bioRecord={format:1,vaultId:envelope.vaultId,vaultSalt:envelope.salt,credentialId:id,prfSalt:salt64,iv:base64(iv),cipher:base64(new Uint8Array(cipher))};await dbPut('biometric',bioRecord);toast('Biometria ativada neste dispositivo');if(modal?.title==='Configurações')openSettings();
 }catch(e){console.warn('Biometria não habilitada:',e.name);toast(biometricError(e),true)}
}
async function askBiometricPassword(){return new Promise(resolve=>{const overlay=document.createElement('div');overlay.className='overlay modal-center';overlay.style.zIndex='195';overlay.innerHTML='<section class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h2>Ativar biometria</h2></div><div class="sheet-body"><p>Confirme a senha mestra antes de autorizar este dispositivo.</p><label>Senha mestra</label><input type="password" id="bioMasterPass" autocomplete="current-password" style="width:100%"></div><div class="sheet-actions"><button class="btn outline" id="bioCancel" type="button">Cancelar</button><button class="btn green" id="bioConfirm" type="button">Continuar</button></div></section>';document.body.append(overlay);const finish=value=>{overlay.remove();resolve(value)};overlay.querySelector('#bioCancel').onclick=()=>finish(null);overlay.querySelector('#bioConfirm').onclick=()=>finish(overlay.querySelector('#bioMasterPass').value);overlay.querySelector('#bioMasterPass').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();overlay.querySelector('#bioConfirm').click()}})})}
async function disableBiometric(){let ok=await confirmDialog({title:'Desativar biometria?',message:'Este dispositivo deixará de abrir o ProtegeAI por biometria. Sua senha mestra e seus cartões permanecerão inalterados.',buttons:[['Cancelar',false],['Desativar',true]]});if(!ok)return;await clearBiometric();toast('Autorização biométrica removida');if(modal?.title==='Configurações')openSettings()}
async function unlockWithBiometrics(){if(!biometricActive()||!bioSupported()){toast('Desbloqueio biométrico indisponível neste contexto. Use a senha mestra.',true);return false}
 const b=document.querySelector('#authBio');if(b)b.disabled=true;
 try{const secret=await getPrfSecret(bioRecord.credentialId,bioRecord.prfSalt);const unwrap=await crypto.subtle.importKey('raw',secret,{name:'AES-GCM'},false,['decrypt']);const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unbase64(bioRecord.iv),additionalData:enc.encode('ProtegeAI-Biometrics:'+envelope.vaultId+':'+envelope.salt)},unwrap,unbase64(bioRecord.cipher));const k=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},true,['encrypt','decrypt']);const d=await decodeVault(envelope,k);data=d;key=k;unlockUI();toast('Cofre desbloqueado com biometria');return true}
 catch(e){toast(biometricError(e)+ ' Use a senha mestra.',true);return false}finally{if(b?.isConnected)b.disabled=false}}
async function login(password){try{let k=await derive(password,envelope.salt,envelope.iterations);let d=await decodeVault(envelope,k);key=k;data=d;unlockUI();toast('Cofre desbloqueado');return true}catch(e){toast('Senha incorreta ou arquivo danificado.',false,true);return false}}
async function createVault(password){if(password.length<10){toast('Crie uma senha de pelo menos 10 caracteres.',true);return false}const salt=base64(crypto.getRandomValues(new Uint8Array(16)));const k=await derive(password,salt);const d=freshVault();let e=await encodeVault(d,k,salt,ITERATIONS);await dbPut('vault',e);key=k;data=d;envelope=e;unlockUI();if(folder&&!folderConflict)await writeFolder(e);toast('Cofre criado e criptografado');return true}

function blocked(){return !data||!key}
function profileTypes(p){return [...new Set([...p.categories,...p.items.map(i=>i.type||'Geral')].filter(Boolean))]}
function enterFolder(name){if(blocked())return;folderView={profileId:active().id,name};$('#searchInput').value='';searchText='';try{history.pushState({protegeFolder:name},'');folderHistory=true}catch{}renderHome();window.scrollTo({top:0,behavior:'instant'})}
function exitFolder(fromHistory=false){folderView=null;$('#searchInput').value='';searchText='';if(!fromHistory&&folderHistory){folderHistory=false;skipPop=true;history.back()}else folderHistory=false;renderHome()}
function renderHome(){
 if(blocked())return;
 updateTheme();const p=active(),inFolder=!!(p.prefs.folders&&folderView?.profileId===p.id);
 if(!p.prefs.folders||folderView?.profileId!==p.id)folderView=null;
 const inside=!!folderView;

 $('#editButton').classList.toggle('active',editMode);
 $('#editButton').setAttribute('aria-pressed',String(editMode));
 $('#folderBack').classList.toggle('hidden',!inside);
 $('#headingTitle').textContent=inside?folderView.name:'Cofre de '+p.name;
 $('#subtitle').textContent=inside?'Pasta: '+folderView.name+' · '+(editMode?'modo edição':'segure para reorganizar cartões'):(p.prefs.folders?'Toque em uma pasta para visualizar os acessos':editMode?'Modo edição ativo · selecione um cartão para modificar':'Segure um cartão para reorganizar');
 $('#counter').textContent=(inside?p.items.filter(i=>(i.type||'Geral')===folderView.name).length:p.items.length)+' '+(p.items.length===1&&!inside?'item':'itens');
 $('#groupQuick').innerHTML=p.prefs.folders?icon('folder'):(p.prefs.group?icon('grid'):icon('list'));
 $('#groupQuick').title=p.prefs.folders?'Exibindo pastas · Próximo: tipos separados':p.prefs.group?'Exibindo tipos separados · Próximo: todos os cartões':'Exibindo todos os cartões · Próximo: pastas';$('#groupQuick').setAttribute('aria-label',$('#groupQuick').title);
 const q=searchText,all=p.items.filter(x=>!q||[x.name,x.type,...x.fields.flatMap(f=>[f.label,f.value])].some(t=>String(t||'').toLocaleLowerCase('pt-BR').includes(q)));
 const holder=$('#items');
 // Busca global: ignora a pasta atualmente aberta e as divisões recolhidas.
 // Os resultados são cartões reais, não apenas os nomes das pastas.
 if(q){
  $('#counter').textContent=all.length+' '+(all.length===1?'resultado':'resultados');
  holder.innerHTML=all.length?'<section class="section search-results"><h2 class="section-title">Resultados da busca <small>'+all.length+'</small></h2><div class="entries '+(p.prefs.view==='list'?'list'+(p.prefs.compactList?' slim-list':''):'cards columns-set')+'" data-cols="'+(p.prefs.columns||1)+'" style="--item-cols:'+(p.prefs.columns||1)+'">'+all.map(i=>renderEntry(i,p)).join('')+'</div></section>':'<div class="empty"><div class="big">⌕</div><strong>Nenhum resultado</strong><p>Tente outro título, tipo, login ou valor de campo.</p></div>';

  holder.querySelectorAll('[data-icon-entry]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();const item=active()?.items.find(i=>i.id===btn.dataset.iconEntry);if(item)openEditor(item,{showIcon:true})});setupButtonTips(holder);
  return;
 }
 if(p.prefs.folders&&!inside){
  const cats=profileTypes(p).filter(name=>!q||name.toLocaleLowerCase('pt-BR').includes(q)||all.some(i=>(i.type||'Geral')===name));

  holder.innerHTML=cats.length?'<div class="folder-grid '+(p.prefs.view==='list'?'folder-list'+(p.prefs.compactList?' slim-list':''):'columns-set')+'" data-cols="'+(p.prefs.columns||2)+'" style="--item-cols:'+(p.prefs.columns||2)+'">'+cats.map(name=>{const count=p.items.filter(i=>(i.type||'Geral')===name).length;return '<article class="folder-tile category-draggable" tabindex="0" role="button" data-catname="'+esc(name)+'" aria-label="Abrir pasta '+esc(name)+'">'+folderPictureMarkup(p,name)+'<div class="folder-text"><strong>'+esc(name)+'</strong><small>'+count+' '+(count===1?'cartão':'cartões')+'</small></div><span class="folder-arrow">'+icon('chev')+'</span></article>'}).join('')+'</div>':'<div class="empty"><div class="big">📁</div><strong>Nenhuma pasta encontrada</strong><p>Adicione um tipo em Configurações ou crie um cartão.</p></div>';

function normalizedName(v){return String(v||'').normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleLowerCase('pt-BR')}
function normalizeEntryIdentity(e){const login=e.fields?.find(f=>normalizedName(f.label)==='login')?.value||'';return normalizedName(e.type)+'|'+normalizedName(e.name)+'|'+normalizedName(login)}
function safeStamp(v){return Number.isFinite(+v)&&+v>0?+v:0}
function mergeFields(localFields,remoteFields,remoteNewer){
 const out=structuredClone(localFields||[]);
 for(const rf of remoteFields||[]){
  const idIdx=out.findIndex(f=>f.id&&rf.id&&f.id===rf.id);
  const labelMatches=out.map((f,i)=>normalizedName(f.label)===normalizedName(rf.label)?i:-1).filter(i=>i>=0);
  const i=idIdx>=0?idIdx:(labelMatches.length===1?labelMatches[0]:-1);
  if(i<0){out.push(structuredClone(rf));continue}
  const lf=out[i],newer=remoteNewer?rf:lf,older=remoteNewer?lf:rf;
  const combined={...older,...newer,id:lf.id||rf.id};
  // Se o registro mais recente contém um campo sem valor, aproveitar o valor mais antigo disponível.
  if(!String(newer.value??'').length&&String(older.value??'').length)combined.value=older.value;
  if(!String(newer.label??'').trim())combined.label=older.label;
  out[i]=combined;
 }
 return out
}
function mergeEntry(localEntry,remoteEntry){
 const remoteNewer=safeStamp(remoteEntry.updatedAt)>safeStamp(localEntry.updatedAt);
 const winner=remoteNewer?remoteEntry:localEntry,loser=remoteNewer?localEntry:remoteEntry;
 const merged={...structuredClone(loser),...structuredClone(winner),id:localEntry.id};
 merged.fields=mergeFields(localEntry.fields,remoteEntry.fields,remoteNewer);
 merged.createdAt=Math.min(safeStamp(localEntry.createdAt)||Date.now(),safeStamp(remoteEntry.createdAt)||Date.now());
 merged.updatedAt=Math.max(safeStamp(localEntry.updatedAt),safeStamp(remoteEntry.updatedAt));
 return merged
}
function mergeProfilesPreview(localVault,remoteVault){
 const result=structuredClone(localVault),stat={newProfiles:0,joinedProfiles:0,newCards:0,updatedCards:0,mergedFields:0};
 for(const rp of remoteVault.profiles){
  const lp=result.profiles.find(p=>normalizedName(p.name)===normalizedName(rp.name));
  if(!lp){const imported=structuredClone(rp);if(result.profiles.some(p=>p.id===imported.id))imported.id=uid();result.profiles.push(imported);stat.newProfiles++;stat.newCards+=imported.items.length;continue}
  stat.joinedProfiles++;
  for(const c of rp.categories||[])if(!lp.categories.some(v=>normalizedName(v)===normalizedName(c)))lp.categories.push(c);
  for(const ri of rp.items||[]){
   let ix=lp.items.findIndex(i=>i.id===ri.id);
   if(ix<0){const matches=lp.items.map((i,j)=>normalizeEntryIdentity(i)===normalizeEntryIdentity(ri)?j:-1).filter(j=>j>=0);
    if(matches.length===1)ix=matches[0];
   }
   if(ix<0){const card=structuredClone(ri);if(lp.items.some(i=>i.id===card.id))card.id=uid();lp.items.push(card);stat.newCards++;continue}
   const previous=lp.items[ix];const previousFieldCount=previous.fields?.length||0;
   lp.items[ix]=mergeEntry(previous,ri);stat.mergedFields+=Math.max(0,lp.items[ix].fields.length-previousFieldCount);stat.updatedCards++;
  }
 }
 return {result,stat}
}

let deferredPwaPrompt=null,pwaWasInstalled=false;

function updatePwaInstallUi(scope=document){

}

}
